var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">One token stream: text</tspan><tspan x="0" y="-4.9">tokens and fly tokens</tspan><tspan x="0" y="16.1">(TICK, spike, DRIVE, SAY,</tspan><tspan x="0" y="37.1">MOVE)</tspan></text></g><g class="pele-node pele-shape-rect" data-id="qwen" transform="translate(426.49,218)"><rect x="-114.94" y="-54" width="229.87" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Qwen3.5-4B: 32 decoder</tspan><tspan x="0" y="-4.9">layers, weights unchanged,</tspan><tspan x="0" y="16.1">run on text tokens and</tspan><tspan x="0" y="37.1">skipped on fly tokens</tspan></text></g><g class="pele-node pele-shape-rect" data-id="l1" transform="translate(189.98,414)"><rect x="-110.66" y="-54" width="221.33" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Layer 1: drive registers</tspan><tspan x="0" y="-4.9">7 commands from Qwen's</tspan><tspan x="0" y="16.1">answer,</tspan><tspan x="0" y="37.1">3 senses from the world</tspan></text></g><g class="pele-node pele-shape-rect" data-id="l2" transform="translate(445.8,414)"><rect x="-97.15" y="-54" width="194.3" height="108" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Layer 2: spike ring</tspan><tspan x="0" y="-4.9">a 1.8 ms delayed read</tspan><tspan x="0" y="16.1">through</tspan><tspan x="0" y="37.1">24.9 M connections</tspan></text></g><g class="pele-node pele-shape-rect" data-id="l3" transform="translate(682.31,414)"><rect x="-91.36" y="-33" width="182.72" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Layer 3: membranes</tspan><tspan x="0" y="16.1">and motor readout</tspan></text></g><g class="pele-node pele-shape-rect" data-id="head" transform="translate(426.49,560)"><rect x="-49.13" y="-24" width="98.26" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">LM head</text></g><g class="pele-node pele-shape-rect" data-id="text" transform="translate(75.98,685)"><rect x="-67.98" y="-33" width="135.97" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">text logits:</tspan><tspan x="0" y="16.1">Qwen's words</tspan></text></g><g class="pele-node pele-shape-rect" data-id="spikes" transform="translate(298.01,695.5)"><rect x="-114.04" y="-43.5" width="228.08" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">spike logits: membrane</tspan><tspan x="0" y="5.6">minus threshold, so greedy</tspan><tspan x="0" y="26.6">decoding fires the neuron</tspan></text></g><g class="pele-node pele-shape-rect" data-id="move" transform="translate(554.98,685)"><rect x="-102.93" y="-33" width="205.86" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">MOVE rows:</tspan><tspan x="0" y="16.1">motor rates for the body</tspan></text></g><g class="pele-node pele-shape-rect" data-id="say" transform="translate(773.26,685)"><rect x="-75.36" y="-33" width="150.72" height="66" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">SAY rows:</tspan><tspan x="0" y="16.1">the printed word</tspan></text></g></g></svg>